# compose.prod.yaml mounts this over nginx.conf. The certificates come from scripts/make-certs.sh.
server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  # HTTPS only, a year, without preload: on the same level as the included headers, so all of them hold.
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/kanabol-app.conf;
}
