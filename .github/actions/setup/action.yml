# What every job of .github/workflows/ci.yml needs before a check script runs (docs/ci.md): .NET, Node with
# npm's cache, NuGet's cache, sh as bash (as Git for Windows has it), a PostgreSQL 17 of the job's own that the
# scripts may stop and start with pg_ctl, and scripts/setup.sh. Nothing here is a secret: the database trusts
# local connections and lives only as long as the job.
name: Kanabol setup
description: .NET, Node, a restartable PostgreSQL 17 on port 5433 and scripts/setup.sh
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', 'dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-

    # On Windows the scripts run under Git for Windows' sh, which is bash; dash would read them differently.
    - name: sh is bash
      shell: bash
      run: |
        sudo ln -sf bash /usr/bin/sh
        sh -c 'echo "sh is bash $BASH_VERSION"'

    # PostgreSQL 17 from its own apt repository, without the cluster Debian would start on 5432: check-docker.sh 5
    # needs that port free. The job's cluster is on 5433, in the C locale, as the scripts' databases expect.
    - name: PostgreSQL 17
      shell: bash
      run: |
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
        sudo apt-get install -y -qq postgresql-17 >/dev/null
        sudo pg_dropcluster --stop 17 main 2>/dev/null || true
        if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
          echo "Something listens on 5432, which check-docker.sh 5 needs free."
          exit 1
        fi
        pg_bin=/usr/lib/postgresql/17/bin
        pg_home="$RUNNER_TEMP/postgres"
        mkdir -p "$pg_home"
        "$pg_bin/initdb" -D "$pg_home/pgdata" -U postgres --auth=trust -E UTF8 --no-locale >/dev/null
        printf "port = 5433\nlisten_addresses = '127.0.0.1'\nunix_socket_directories = '%s'\n" "$pg_home" \
          >>"$pg_home/pgdata/postgresql.conf"
        "$pg_bin/pg_ctl" -D "$pg_home/pgdata" -l "$pg_home/postgres.log" -w start
        {
          echo "KANABOL_PGBIN=$pg_bin"
          echo "KANABOL_PGDATA=$pg_home/pgdata"
          echo "KANABOL_CHECK_DB=Host=127.0.0.1;Port=5433;Username=postgres;Database=postgres"
        } >>"$GITHUB_ENV"

    - name: git identity for the scripts' throwaway commits
      shell: bash
      run: git config --global user.name 'Kanabol CI' && git config --global user.email ci@kanabol.invalid

    - name: scripts/setup.sh
      shell: bash
      run: sh scripts/setup.sh
